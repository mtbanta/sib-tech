# Stack C (cyrus): one small always-on machine, no public service (it only makes outbound calls).
app = "sib-tech-cyrus"
primary_region = "sjc"

[build]

[env]
  ALPACA_DATA_FEED = "iex"
  # The regular close-out, in minutes before the market close (Michael's night build request of 2026-11-16, item 4). The default,
  # without this line, is 5 (2:55 PM Central). 15 for the test: 2:45 PM Central, or 11:45 AM on a half day. A whole number from 5 to 30.
  CLOSEOUT_MINUTES_BEFORE_CLOSE = "15"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"
